name: Publish timestamped .NET tool

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan source history for secrets
        shell: pwsh
        run: ./.github/scripts/scan-secrets.ps1

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Compute snapshot version
        id: version
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'Set the NUGET_USER repository variable to the NuGet profile name.'
          }
          $commitTime = git show -s --format=%cI HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the checked-out commit timestamp.' }
          $stamp = [DateTimeOffset]::Parse($commitTime, [Globalization.CultureInfo]::InvariantCulture).UtcDateTime.ToString('yyyyMMddHHmmss', [Globalization.CultureInfo]::InvariantCulture)
          $version = "0.1.0-ci.$stamp.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
          "value=$version" >> $env:GITHUB_OUTPUT
          "### dotnet opencode $version" >> $env:GITHUB_STEP_SUMMARY
          "Source commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY

      - name: Build and pack the tool
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $env:OPENCODE_DOTNET_SDK_ROOT = Split-Path (Get-Command dotnet -CommandType Application).Source
          $artifacts = Join-Path $env:RUNNER_TEMP 'dotnet-opencode-release'
          ./packaging/pack.ps1 -Version $env:PACKAGE_VERSION -ArtifactsPath $artifacts
          if ($LASTEXITCODE -ne 0) { throw "Tool packaging failed with exit code $LASTEXITCODE." }
          $package = Join-Path $artifacts "packages/dotnet-opencode.$env:PACKAGE_VERSION.nupkg"
          if (!(Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "The expected tool package was not produced: $package"
          }
          "TOOL_PACKAGE=$package" >> $env:GITHUB_ENV

      - name: Retain package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-opencode-${{ steps.version.outputs.value }}
          path: ${{ env.TOOL_PACKAGE }}
          if-no-files-found: error
          retention-days: 14

      - name: Authenticate to NuGet using GitHub OIDC
        id: login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push $env:TOOL_PACKAGE --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed with exit code $LASTEXITCODE." }

      - name: Create matching GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'dotnet-opencode-release.md'
          @(
            '- Development snapshot of the C#/.NET 11 OpenCode V2 port.'
            "- Source: $env:GITHUB_SHA"
            '- Compatibility remains in progress; this is not a full-parity certification.'
            ''
            '```powershell'
            "dotnet tool install --global dotnet-opencode --version $env:PACKAGE_VERSION"
            'dotnet opencode'
            '```'
          ) | Set-Content -LiteralPath $notes
          gh release create "v$env:PACKAGE_VERSION" $env:TOOL_PACKAGE --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "dotnet opencode $env:PACKAGE_VERSION" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease creation failed with exit code $LASTEXITCODE." }
